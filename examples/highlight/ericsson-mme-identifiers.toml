name = "ericsson-mme-identifiers"

[[rule]]
name = "imsi"
scope = "output"
pattern = '^\\s*IMSI\\s*:\\s*[0-9]{15}\\s*$'
fg = "#e3b341"
bold = true

[[rule]]
name = "msisdn"
scope = "output"
pattern = '^\\s*Mobile Subscriber ISDN No\\.\\s*:\\s*\\+?[0-9]{8,15}\\s*$'
fg = "#a3be8c"
bold = true

[[rule]]
name = "imei"
scope = "output"
pattern = '^\\s*IMEI\\s*:\\s*[0-9]{15}\\s*$'
fg = "#b48ead"
bold = true
