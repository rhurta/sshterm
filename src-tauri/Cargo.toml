[package]
name = "sshterm"
version = "0.1.0"
description = "Custom SSH Terminal"
authors = ["rhurta"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sshterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
toml = "0.8"
regex = "1"
# M3: local date-time in log file names
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# M2: ssh.exe over ConPTY, password hand-off via named pipe, and events
portable-pty = "0.9"
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "rt"] }
base64 = "0.22"
async-trait = "0.1"
# M8a: native SSH/SFTP transport; pin the audited protocol implementation.
russh = { version = "=0.65.2", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "=3.0.1"
# Parse OpenSSH @revoked known_hosts entries before applying Russh TOFU checks.
hmac = "0.13"
sha1 = "0.11"
# serde and serde_json come from the template; serde needs features = ["derive"]

[target.'cfg(windows)'.dependencies]
# M4: read PuTTY sessions from HKCU\Software\SimonTatham\PuTTY\Sessions.
winreg = "0.52"
# Askpass pipe DACL: only the current user may connect. The pipe is created
# with CreateNamedPipeW + a current-user-only ACL applied at creation time.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
