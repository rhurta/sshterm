name: Update M8 Cargo lockfile

on:
  push:
    branches:
      - "feature/m8-sftp"
    paths:
      - "src-tauri/Cargo.toml"
      - ".github/workflows/m8-lockfile.yml"

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore(m8a): update Cargo.lock for native SFTP"
          git push
